<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradient Border from rose-600 via festive-500 to amber-500 -->
    <linearGradient id="gm-border" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Inner Background Tint from rose-500/20 to amber-500/10 -->
    <linearGradient id="gm-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with slate-900 background and vibrant gradient border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="#0f172a" stroke="url(#gm-border)" stroke-width="3"/>
  <rect x="4" y="4" width="56" height="56" rx="14.5" fill="url(#gm-inner)"/>

  <!-- Gift Box Icon (matching ApplicationLogo.vue) -->
  <g transform="translate(15, 15) scale(1.4166)" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="3" y="8" width="18" height="4" rx="1"/>
    <path d="M12 8v13"/>
    <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
    <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>
  </g>
</svg>
